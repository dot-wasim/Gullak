name: Build Android APK

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Release Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build web application
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Rename APK for release
        run: |
          mkdir -p release-output
          cp android/app/build/outputs/apk/debug/app-debug.apk release-output/Gullak.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Gullak-Android-APK
          path: release-output/Gullak.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          name: "Gullak Android App v1.2.0"
          tag_name: "v1.2.0"
          files: release-output/Gullak.apk
          body: |
            ## 📱 Gullak Android App Release (v1.2.0)
            
            Download the updated **Gullak.apk** below and install or update on your Android phone!
            
            ### ✨ What's New in v1.2.0:
            - 🏦 **Multiple Accounts Support:** Add and manage multiple bank accounts (e.g. SBI Bank, HDFC Bank, ICICI) and Cash wallets.
            - 💳 **Deposit To & Paid From:** When adding income, choose which account receives the funds; when recording an expense, choose which account is debited.
            - 🛡️ **Insufficient Balance & Overdraft Guard:** Real-time balance check prevents recording an expense that exceeds an account's available balance with clear warnings.
            - ⭐ **Custom Default Account:** Easily select your preferred default account in Settings or when creating accounts.
            - 🏧 **Cash Withdrawal Tag:** Dedicated "Cash Withdrawal" category for ATM withdrawals.
            - 🔍 **Account Filtering & Badges:** Filter transactions by specific bank account or wallet in History, and view account badges across your feed.
            - 🔐 **Zero-Knowledge Encrypted:** All account balances and metadata are end-to-end encrypted with AES-256-GCM.
            
            ### How to Install / Update:
            1. Download `Gullak.apk` to your phone.
            2. Tap the downloaded file.
            3. Tap **Install** or **Update**.
            4. Launch Gullak!
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
