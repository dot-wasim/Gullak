name: Build Android APK

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Release Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build web application
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Rename APK for release
        run: |
          mkdir -p release-output
          cp android/app/build/outputs/apk/debug/app-debug.apk release-output/Gullak.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Gullak-Android-APK
          path: release-output/Gullak.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          name: "Gullak Android App v1.2.1"
          tag_name: "v1.2.1"
          files: release-output/Gullak.apk
          make_latest: true
          body: |
            ## 📱 Gullak Android App Release (v1.2.1)
            
            Download the updated **Gullak.apk** below and install or update on your Android phone!
            
            ### ✨ What's in v1.2.1:
            - 🏦 **Multiple Accounts & Banks:** Manage multiple accounts (SBI Bank, HDFC, ICICI, Cash) with real-time balance tracking.
            - 💳 **Deposit To & Paid From:** Select the receiving account for Income and the debited account for Expenses.
            - 🛡️ **Insufficient Balance Protection:** Prevents recording expenses exceeding available account funds.
            - ⭐ **Default Account Selection:** Easily select your preferred primary account.
            - 🏧 **Cash Withdrawal Category:** Built-in category for ATM deductions.
            - 🧹 **WebView & Cache Invalidation:** Removed WebView service worker interception to ensure updates take effect immediately on launch.
            - 🏷️ **Visible Version Indicator:** Header now proudly displays `v1.2` for instant verification.
            
            ### How to Install / Update:
            1. Download `Gullak.apk` to your phone.
            2. Tap the downloaded file in your browser or Files app.
            3. Tap **Install** or **Update**.
            4. Launch Gullak!
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
