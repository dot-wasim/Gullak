name: Build Android APK

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Release Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build web application
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Rename APK for release
        run: |
          mkdir -p release-output
          cp android/app/build/outputs/apk/debug/app-debug.apk release-output/Gullak.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Gullak-Android-APK
          path: release-output/Gullak.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          name: "Gullak Android App v1.1.0"
          tag_name: "v1.1.0"
          files: release-output/Gullak.apk
          body: |
            ## 📱 Gullak Android App Release (v1.1.0)
            
            Download the updated **Gullak.apk** below and install or update on your Android phone!
            
            ### ✨ What's New in v1.1.0:
            - 📊 **Month-wise Tracker:** Easily compare earnings, expenses, and savings rate month-by-month with intuitive navigation.
            - ⏱️ **Goal Completion Duration:** Tracks and displays how long it took to achieve savings targets (e.g. *Completed in 14 days*).
            - 📱 **Clean Installed UI:** Automatically hides the "Install App" button when running inside the installed APK or standalone app.
            - 🔐 **Zero-Knowledge Encryption:** Full AES-256-GCM + PBKDF2 hardware-accelerated privacy on Android.
            
            ### How to Install / Update:
            1. Download `Gullak.apk` to your phone.
            2. Tap the downloaded file.
            3. Tap **Install** or **Update**.
            4. Launch Gullak!
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
